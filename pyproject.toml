[project]
name = "devgraph"
version = "0.1.0"
description = "Local-first developer knowledge graph platform"
requires-python = ">=3.13"
dependencies = [
    "neo4j>=5.26",
    # The driver's Rust packer, a drop-in for its pure-Python one (each release pins its `neo4j`),
    # only where it ships wheels: elsewhere the pure-Python driver is used, never a Rust build.
    # No standard marker names a free-threaded build, which has no wheel either.
    "neo4j-rust-ext>=5.26; platform_python_implementation == 'CPython' and (sys_platform == 'win32' or sys_platform == 'darwin' or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')))",
    "tree-sitter>=0.23,<0.24",
    "tree-sitter-python>=0.23,<0.24",
    "tree-sitter-javascript>=0.23,<0.24",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-c-sharp>=0.21,<0.22",
    "tree-sitter-cpp>=0.23,<0.24",
    "tree-sitter-java>=0.23,<0.24",
    "tree-sitter-kotlin>=1.1,<1.2",
    "tree-sitter-rust>=0.21,<0.22",
    "tree-sitter-go>=0.23,<0.24",
    "watchdog>=6.0,<7",
    "typer>=0.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "pystray>=0.19",
    "pillow>=10.4",
    "mcp>=2.0",
    "GitPython>=3.1",
    "requests>=2.32",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "networkx>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
devgraph = "devgraph.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["devgraph*"]

[tool.setuptools.package-data]
# The dashboard's page and its vendored scripts (no CDN at runtime).
"devgraph.dashboard" = ["static/*.html", "static/*.js", "static/vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
